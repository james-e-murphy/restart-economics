[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restart-economics"
version = "0.1.0"
description = "Policy evaluator for restart economics of AI agent executions"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "scikit-learn>=1.3", "matplotlib>=3.7", "jupyter"]
exhibits = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
